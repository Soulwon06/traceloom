[project]
name = "traceloom-server"
version = "0.13.0"
description = "A local dashboard for inspecting Python HTTP traffic, tests, logs, and exceptions"
license = "MIT"
requires-python = ">=3.14"
readme = "README.md"
authors = [{ name = "Roman Imankulov" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "tortoise-orm>=0.22.0",
    "aiosqlite>=0.20.0",
    "rich>=13.0.0",
    "typer>=0.15.0",
]

[project.scripts]
traceloom-server = "traceloom_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceloom_server"]
