[tool.bumpversion]
current_version = "0.13.0"
commit = true
tag = true
pre_commit_hooks = ["uv lock", "git add uv.lock"]
tag_name = "traceloom-server/v{new_version}"
tag_message = "Release traceloom-server v{new_version}"
message = "Bump traceloom-server version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "server/pyproject.toml"
key_path = "project.version"

[[tool.bumpversion.files]]
filename = "server/src/traceloom_server/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
