[project]
name = "traceloom-workspace"
version = "0.1.0"
description = "TraceLoom monorepo workspace"
requires-python = ">=3.10"
dependencies = ["traceloom", "traceloom-server"]

[tool.uv.workspace]
members = ["server", "clients/python"]

[tool.uv.sources]
traceloom = { workspace = true }
traceloom-server = { workspace = true }

[dependency-groups]
dev = [
    "aiohttp>=3.11.0",
    "httpx>=0.28.1",
    "ty>=0.0.1a5",
    "pre-commit>=4.2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "requests>=2.32.5",
    "bump-my-version>=1.2.7",
    "zensical>=0.0.23",
    "boto3>=1.42.68",
    "django>=4.2",
]

[tool.ruff]
lint.preview = true
lint.select = ["E4", "E7", "E9", "F", "UP", "I", "PLC0415"]
exclude = ["*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["clients/python/tests", "server/tests", "tests"]
addopts = ["--import-mode=importlib"]

[tool.ty.environment]
python-version = "3.14"
