[project]
name = "traceloom"
version = "0.18.0"
description = "Capture Python HTTP traffic, pytest executions, logs, and exceptions in a local dashboard"
license = "MIT"
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "Roman Imankulov" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
pytest = ["pytest>=7"]

[project.scripts]
traceloom = "traceloom.cli:main"

[project.entry-points.pytest11]
traceloom = "traceloom.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceloom"]
